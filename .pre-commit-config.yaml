default_install_hook_types:
    - pre-commit
    - post-checkout
    - post-merge
    - post-rewrite

repos:
    # Ruff - Fast Python linter and formatter
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.4
      hooks:
          - id: ruff-check
            args: [--fix, --exit-non-zero-on-fix]
          - id: ruff-format

    # UV - Python dependency management tool
    #
    # uv.lock is gitignored: this package is installed with `uv tool install`
    # and consumed as a git dependency, both of which resolve fresh, so a
    # committed lock would only ever describe the maintainer's machine. The
    # hook is still worth running — it fails the commit when pyproject.toml
    # stops resolving, which for a package other repos install is the failure
    # worth catching early.
    - repo: https://github.com/astral-sh/uv-pre-commit
      rev: 0.12.6
      hooks:
          - id: uv-lock

    # General file checks
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-toml
          - id: check-added-large-files
            args: ["--maxkb=2048"]
          - id: check-merge-conflict
          - id: debug-statements
          - id: check-docstring-first
          - id: detect-private-key

    - repo: local
      hooks:
          # Run pytest tests with uv
          - id: pytest
            name: pytest
            entry: uv run tests
            language: system
            pass_filenames: false
            always_run: true

          # Run type checks with ty
          - id: ty-check
            name: ty-check
            language: system
            entry: uvx ty check
            pass_filenames: false
            types: [python]
