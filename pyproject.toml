[project]
name = "okf-kb"
version = "0.1.0"
description = "Tooling for agent-maintained Open Knowledge Format knowledge bases"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.2",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2",
    "rich>=13.0",
    "typer>=0.12",
]

# Heavy, platform-sensitive dependencies are opt-in. Every module that needs one
# imports it inside the function that uses it, so a core-only install imports and
# runs fine and fails only on the subcommand whose extra is missing.
[project.optional-dependencies]
ingest = [
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "markitdown[docx,pptx,xlsx,xls,outlook]>=0.1.8,<0.2",
    "pymupdf>=1.24",
    "requests>=2.31",
]
video = ["mlx-whisper>=0.4.3", "python-slugify>=8.0.4", "yt-dlp>=2026.3.17"]
all = ["okf-kb[ingest,video]"]

[project.scripts]
kb-search = "okf_kb.search:app"
kb-stats = "okf_kb.stats:app"
kb-export = "okf_kb.export:app"
kb-ingest = "okf_kb.ingest:main"
kb-health = "okf_kb.health:app"
kb-doctor = "okf_kb.doctor:app"
kb-graph = "okf_kb.graph:app"
kb-read = "okf_kb.read:app"
kb-mcp = "okf_kb.mcp_server:main"
kb-index = "okf_kb.index_gen:app"
kb-provenance = "okf_kb.provenance:app"
kb-video = "okf_kb.video:main"
tests = "pytest:main"

[dependency-groups]
# dev carries both extras so a source checkout can run every kb-* command and
# exercise every code path. [ingest] must be here regardless: its tests do real
# fetching and rewriting and would silently skip without it. [video] costs a
# torch download on every sync, which is the price of not having kb-video fail
# only once someone reaches for it.
dev = [
    "import-linter>=2.15",
    "okf-kb[ingest,video]",
    "pytest>=8.3",
    "python-docx>=1.1",
]
all = ["okf-kb[ingest,video]"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

# Whether yt-dlp, mlx-whisper and slugify resolve depends on which extras the
# checking environment happens to have, so the `ty: ignore[unresolved-import]`
# on each lazy import is load-bearing in a core-only install and dead weight in
# a full one. Silencing the unused-directive warning is what lets one source
# tree type-check cleanly in both.
[tool.ty.rules]
unused-ignore-comment = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

# The layers mirror the dependency direction CLAUDE.md states as rules: a higher
# module may import a lower one and never the reverse, and modules separated by
# `|` are independent siblings. `lint-imports` runs from pre-commit and from
# tests/acceptance/test_boundaries.py.
[tool.importlinter]
root_package = "okf_kb"

[[tool.importlinter.contracts]]
name = "Read-side modules sit above the shared model and config"
type = "layers"
layers = [
    "okf_kb.mcp_server",
    "okf_kb.read | okf_kb.stats | okf_kb.health",
    "okf_kb.graph | okf_kb.search | okf_kb.index_gen | okf_kb.provenance | okf_kb.doctor | okf_kb.ingest | okf_kb.export",
    "okf_kb.okf",
    "okf_kb.gitmeta | okf_kb.article | okf_kb.links | okf_kb.extras",
    "okf_kb.frontmatter",
    "okf_kb.config",
]

[[tool.importlinter.contracts]]
name = "The MCP server cannot reach a writing module"
type = "forbidden"
source_modules = ["okf_kb.mcp_server"]
forbidden_modules = [
    "okf_kb.ingest",
    "okf_kb.export",
    "okf_kb.provenance",
    "okf_kb.index_gen",
    "okf_kb.okf",
    "okf_kb.gitmeta",
    "okf_kb.video",
]

[[tool.importlinter.contracts]]
name = "Nothing outside okf_kb.video imports it"
type = "forbidden"
source_modules = [
    "okf_kb.mcp_server",
    "okf_kb.read",
    "okf_kb.stats",
    "okf_kb.health",
    "okf_kb.graph",
    "okf_kb.search",
    "okf_kb.index_gen",
    "okf_kb.provenance",
    "okf_kb.doctor",
    "okf_kb.ingest",
    "okf_kb.export",
    "okf_kb.okf",
]
forbidden_modules = ["okf_kb.video"]
